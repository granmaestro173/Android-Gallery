name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test categorizer and build debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: gallery-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Gallery.apk
          NOTES="Debug build from commit ${GITHUB_SHA::7}. Download Gallery.apk and open it on your phone to install. Needs Android 5.0 or newer."
          if gh release view latest >/dev/null 2>&1; then
            # Replace the file in place so the download link keeps working.
            gh release upload latest Gallery.apk --clobber
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest Gallery.apk --title "Gallery (latest build)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
